name: Verificações MakerCusto
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar tipos
        run: npm run check
      - name: Testes do motor de custos
        run: npm run test
      - name: Build estático
        run: npm run build
      - name: Instalar navegador de testes
        run: npx playwright install --with-deps chromium
      - name: Testes de interface desktop e mobile
        run: npm run test:e2e
      - name: Evidências quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: makercusto-test-results
          path: test-results/
          if-no-files-found: ignore
